# Default values for the PoC console application (Phase 4).
#
# The Application is only rendered when console.enabled is true; enable per
# environment together with regional_cluster.custom_authorizer.enabled. The
# targetGroup.arn is overridden by the ApplicationSet valuesObject from the
# terraform output (console_target_group_arn) threaded through cluster
# secret annotations. The image is built from console/apps/web in
# rosa-seaplane-api with the VITE_* build args (gateway URL, OIDC issuer,
# client ID).

console:
  enabled: false

  namespace: console

  app:
    name: console
    image:
      repository: quay.io/cdoan0/rosa-seaplane-api-console
      tag: "poc"
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi

  service:
    port: 8080

  targetGroup:
    arn: ""
    targetType: ip

seaplane:
  applicationName: console
  namespace: argocd
  targetNamespace: console
  project: default

  source:
    repoURL: https://github.com/cdoan1/rosa-seaplane-api.git
    targetRevision: poc-custom-authorizer
    path: console/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
